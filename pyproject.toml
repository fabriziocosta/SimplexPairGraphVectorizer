[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplex-pair-vectorizer"
version = "0.1.0"
description = "Sparse simplex-pair feature extraction for labeled graphs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "orjson>=3.9",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
protein = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "xgboost>=2.0",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
